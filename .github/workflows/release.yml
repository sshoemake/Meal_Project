name: Django Release Workflow

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version bump from PR labels
        id: bump
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const order = ["major", "minor", "patch"];
            const bump = order.find(b => labels.includes(b)) || "none";
            core.setOutput("bump", bump);

      - name: Compute next version
        id: version
        run: |
          BUMP="${{ steps.bump.outputs.bump }}"
          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(git for-each-ref --sort=-v:refname --format='%(refname:short)' refs/tags | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$LATEST" ]; then
            echo "No existing vX.Y.Z tags found; defaulting to v0.1.0"
            MAJ=0; MIN=0; PAT=0
          else
            V="${LATEST#v}"
            MAJ="${V%%.*}"; REST="${V#*.}"; MIN="${REST%%.*}"; PAT="${REST#*.}"
          fi

          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac

          echo "version=v${MAJ}.${MIN}.${PAT}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  release:
    needs: [prepare, checks]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate version does not already exist
        run: |
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_VERSION' already exists!"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meal_project
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Generate release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_VERSION,
            });
            core.setOutput("body", data.body);

      - name: Create GitHub Release
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.RELEASE_VERSION;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const generated = process.env.RELEASE_BODY || "";

            const body = [
              "## Pre-built Docker image",
              "```bash",
              `docker pull ghcr.io/${owner}/meal_project:${version}`,
              "```",
              "---",
              generated,
            ].join("\n");

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: version,
              name: `Release ${version}`,
              body,
            });