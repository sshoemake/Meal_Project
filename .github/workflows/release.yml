name: Django Release Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v2.2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like vX.Y.Z (e.g., v2.2.0)"
            exit 1
          fi

      - name: Fetch tags
        run: git fetch --tags

      - name: Check for existing tag
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag '${{ github.event.inputs.version }}' already exists!"
            exit 1
          fi

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Get latest merged PR description
        id: pr_desc
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              base: "main",
              sort: "updated",
              direction: "desc",
              per_page: 1,
            });

            if (prs.data.length === 0) {
              core.setOutput("body", "No merged PRs found");
            } else {
              core.setOutput("body", prs.data[0].body || "No description");
            }

      - name: Set release notes
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "Release ${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## Latest Merged PR" >> $GITHUB_ENV
          echo "${{ steps.pr_desc.outputs.body }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## Pre-built Docker image" >> $GITHUB_ENV
          echo '```bash' >> $GITHUB_ENV
          echo "docker pull ghcr.io/${{ github.repository_owner }}/meal_project:${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo '```' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ env.RELEASE_BODY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meal_project
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}