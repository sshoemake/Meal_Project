name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (commit/branch/tag) to check out and test."
        required: false
        type: string
        default: ""

jobs:
  unit-test:
    name: Lint, migrations & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: app.meal_project.settings.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Lint
        run: ruff check .

      - name: Deploy checks
        env:
          DJANGO_SETTINGS_MODULE: app.meal_project.settings.prod
          DJANGO_ALLOWED_HOSTS: sshoemake.com
          DJANGO_CSRF_TRUSTED_ORIGINS: sshoemake.com
        run: |
          # throwaway key: check validates config shape, not the real secret
          export DJANGO_SECRET_KEY="$(openssl rand -hex 32)"
          python manage.py check --deploy --fail-level WARNING

      - name: Run tests with coverage
        run: coverage run --source=app manage.py test

      - name: Coverage report
        run: coverage report --fail-under=80