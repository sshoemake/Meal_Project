{% extends "meals/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset>
            <legend class="border-bottom mb-4">Store Details</legend>
            {{ form|crispy }}
        </fieldset>
        <div>
            <button class="btn btn-outline-primary" type="submit">Save</button>
        </div>
    </form>
</div>
{% endblock content %}

{% block javascript %}
<script>
    $(function () {
        $("#id_name").focus();
    });
</script>
{% endblock javascript %}
