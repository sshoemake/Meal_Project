{% extends "meals/base.html" %}
{% load static %}

{% block content %}

{% include "meals/includes/partial_cart_selector.html" %}

<br>
<input type="text" id="myInput" placeholder="Search for Meals.." title="Type in a Meal" maxlength="50"
  class="textinput textInput form-control">
</br>

{% include "meals/includes/partial_meal_list.html" %}

<!-- THE MODAL WE WILL BE USING -->
<div class="modal fade" id="modal-book">
  <div class="modal-dialog">
    <div class="modal-content">
    </div>
  </div>
</div>
{% endblock content %}

{% block javascript %}

<script src="{% static 'js/site.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const myInput = document.getElementById("myInput");
    const myTableRows = document.querySelectorAll("#myTable tr");

    // Focus on input
    myInput.focus();

    // Keyup event for filtering
    myInput.addEventListener("keyup", function(e) {
        const value = myInput.value.toLowerCase();

        myTableRows.forEach(function(row) {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(value) ? "" : "none";
        });

        // Enter key behavior
        if (e.key === "Enter") {
            myInput.select();
            // Additional code for Enter can go here
        }
    });
});
</script>

{% endblock javascript %}
