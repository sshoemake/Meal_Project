<ul class="list-group">

{% for meal in meals %}

<li class="list-group-item">

<a
hx-post="{% url 'assign-meal-slot' %}"
hx-vals='{
"cart_id":"{{ cart_id }}",
"weekday":"{{ weekday }}",
"slot_type":"{{ slot_type }}",
"meal_id":"{{ meal.id }}"
}'
hx-target="closest td"
hx-swap="outerHTML"
data-bs-dismiss="modal"
>

{{ meal.name }}

</a>

</li>

{% endfor %}

</ul>
