{% extends "meals/base.html" %}

{% block content %}

<div class="surface">
  <table class="table">
    <thead>
      <th>Ranking</th>
      <th>Meal</th>
      <th>Cart Totals</th>
    </thead>

    <tbody id="myTable">
      {% for meal in object_list %}

      <tr>
        <td>#{{ forloop.counter }}</td>
        <td>{{ meal.meals__name }}</td>
        <td>{{ meal.total }}</td>
      </tr>

      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock content %}

{% block javascript %}

{% endblock javascript %}
